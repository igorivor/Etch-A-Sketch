<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="title">
        <h1>Etch-A-Sketch</h1>
    </div>
    <div class="question">
        <p>How many row and columns you what in grid?</p>
        <input type="number" id="value">
        <button id="btn_S">Submit!</button>
    </div>
    <div class="container"></div>
    <div class="selection">
        <button id="btn_blue"></button>
        <button id="btn_red"></button>
        <button id="btn_yellow"></button>
        <button id="btn_green"></button>
        <button id="btn_orange"></button>
        <button id="btn_purple"></button>
        <button id="btn_pink"></button>
        <button id="btn_brown"></button>
        <button id="btn_gray"></button>
        <button id="btn_black"></button>
    </div>
    <script src="script.js"></script>
</body>
</html>
